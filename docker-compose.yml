version: '3.8'

services:
  db:
    image: postgres:15
    container_name: cdg-freelance-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freelances}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro

volumes:
  pgdata:
