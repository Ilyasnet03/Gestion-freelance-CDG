version: '3.8'

services:
  db:
    image: postgres:15
    container_name: cdg-freelance-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freelances}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro

  sonarqube-db:
    image: postgres:15
    container_name: cdg-sonarqube-db
    restart: always
    environment:
      POSTGRES_DB: ${SONARQUBE_DB:-sonarqube26}
      POSTGRES_USER: ${SONARQUBE_DB_USER:-sonarqube}
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonarqube}
    volumes:
      - sonarqube26_pgdata:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:community
    container_name: cdg-sonarqube
    restart: always
    depends_on:
      - sonarqube-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONARQUBE_DB:-sonarqube26}
      SONAR_JDBC_USERNAME: ${SONARQUBE_DB_USER:-sonarqube}
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonarqube}
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    volumes:
      - sonarqube26_data:/opt/sonarqube/data
      - sonarqube26_extensions:/opt/sonarqube/extensions
      - sonarqube26_logs:/opt/sonarqube/logs

volumes:
  pgdata:
  sonarqube26_pgdata:
  sonarqube26_data:
  sonarqube26_extensions:
  sonarqube26_logs:
