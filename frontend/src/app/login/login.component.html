<article class="login-card" appReveal [class.login-card--error]="error" aria-labelledby="login-title">
  <h2 class="card-title" id="login-title">Connectez-vous</h2>
  <p class="card-description">Accédez à votre espace de gestion CDG.</p>

  @if (error) {
    <div class="error-banner" role="alert">{{ error }}</div>
  }

  <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
    <div class="field-group">
      <label for="email" class="field-label">Adresse e-mail</label>
      <div
        class="input-box"
        [class.input-invalid]="loginForm.controls.email.invalid && loginForm.controls.email.touched"
      >
        <span class="field-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
        </span>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="text-input"
          placeholder="prenom.nom@cdg.ma"
          autocomplete="username"
          required
          [attr.aria-invalid]="loginForm.controls.email.invalid && loginForm.controls.email.touched ? 'true' : 'false'"
        />
      </div>
    </div>

    <div class="field-group">
      <label for="password" class="field-label">Mot de passe</label>
      <div
        class="input-box"
        [class.input-invalid]="loginForm.controls.password.invalid && loginForm.controls.password.touched"
      >
        <span class="field-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </span>
        <input
          id="password"
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          class="text-input password-input"
          placeholder="Votre mot de passe"
          autocomplete="current-password"
          required
          [attr.aria-invalid]="loginForm.controls.password.invalid && loginForm.controls.password.touched ? 'true' : 'false'"
        />
        <button
          type="button"
          class="password-toggle-btn"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
          [attr.aria-pressed]="showPassword"
        >
          @if (showPassword) {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
              <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
              <line x1="2" y1="2" x2="22" y2="22"></line>
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          }
        </button>
      </div>
    </div>

    <div class="options-container">
      <label class="remember-label">
        <input type="checkbox" formControlName="remember" class="remember-check" />
        <span>Se souvenir de moi</span>
      </label>
      <a href="#mot-de-passe-oublie" class="forgot-link" (click)="$event.preventDefault()">
        Mot de passe oublié ?
      </a>
    </div>

    <button type="submit" class="login-btn" [disabled]="loginForm.invalid || loading">
      {{ loading ? 'Connexion…' : 'Se connecter' }}
    </button>
    <p class="restricted-notice">Accès réservé aux utilisateurs autorisés de la CDG</p>
  </form>
</article>
